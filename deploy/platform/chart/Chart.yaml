apiVersion: v2
# Forge itself: the API, the dashboard and the login, for a GitHub
# organization of your own, on a PostgreSQL you run. Not the chart a Forge service is deployed
# with (deploy/argocd/chart). A vX.Y.Z tag publishes it as
# oci://ghcr.io/showmino/charts/forge with version and appVersion X.Y.Z;
# appVersion picks the forge-api image and the deploy chart.
# deploy/k3s/render.sh remains how showmino's own install is rendered.
name: forge
description: Forge, an internal developer platform, for your GitHub organization
type: application
version: 0.27.0
appVersion: "0.27.0"
home: https://forgegate.io
icon: https://forgegate.io/img/favicon.svg
sources:
  - https://github.com/showmino/forge
