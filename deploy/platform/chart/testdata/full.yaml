# Every feature: an Ingress, previews, deploys, cluster capacity, run.secrets
# from 1Password, and a database of its own outside the release.
github:
  org: acme
  appID: "123456"
host: forge.acme.example
ingress:
  tls:
    secretName: forge-tls
database:
  existingSecret: forge-database
  host: forge-db-rw.databases.svc
imageRegistry: acr.acme.example
argocdURL: https://argocd.acme.example
secrets:
  vaults: Services
  deniedItems: forge-github
apps:
  domain: apps.acme.example
  pullSecret: registry
  gateway:
    className: envoy
    annotations:
      service.beta.kubernetes.io/azure-pip-name: forge-apps
previews:
  enabled: true
deploys:
  enabled: true
clusters:
  enabled: true
  name: production
  prometheusURL: http://prometheus.monitoring:9090
web:
  # A second dashboard besides the chart's.
  origins: [https://dash.acme.example]
