# Deploys with services that run published charts, from two allowed repositories.
github:
  org: acme
  appID: "123456"
host: forge.acme.example
apps:
  domain: apps.acme.example
  pullSecret: ghcr
deploys:
  enabled: true
  charts:
    enabled: true
    allowedRepos: [oci://ghcr.io/stefanprodan/charts, https://charts.example.com/stable]
database:
  existingSecret: forge-database
  host: forge-db-rw.databases.svc
