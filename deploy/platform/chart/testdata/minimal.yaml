# The least an install needs: one host through an Ingress, and a database of
# its own outside the release.
github:
  org: acme
  appID: "123456"
host: forge.acme.example
ingress:
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
  tls:
    secretName: forge-tls
database:
  existingSecret: forge-database
  host: forge-db-rw.databases.svc
