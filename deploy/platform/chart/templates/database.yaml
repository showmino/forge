{{- if .Values.database.managed }}
# Forge's database: the service catalog (forge-api) and Dex's logins.
# CloudNativePG creates the Secret named database.secretName (keys uri,
# password, ...) for the owner forge. Backups are database.plugins (for
# example the Barman Cloud plugin); without them the catalog can be
# re-registered from each repo's forge.yaml, and Dex's data is only
# sessions.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: forge-db
  namespace: forge
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie
  storage:
    size: 5Gi
    {{- if .Values.database.storageClass }}
    storageClass: {{ .Values.database.storageClass | quote }} # the volumes outlive an accidental delete
    {{- end }}
  bootstrap:
    initdb:
      database: forge
      owner: {{ .Values.database.user | default "forge" | quote }}
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {memory: 512Mi}
  {{- with .Values.database.plugins }}
  plugins:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.database.serviceAccountAnnotations }}
  serviceAccountTemplate:
    metadata:
      annotations:
        {{- toYaml . | nindent 8 }}
  {{- end }}
  {{- with .Values.database.podLabels }}
  inheritedMetadata:
    labels:
      {{- toYaml . | nindent 6 }}
  {{- end }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: forge-db-dex
  namespace: forge
spec:
  name: {{ .Values.database.dexDatabase | default "dex" | quote }}
  owner: {{ .Values.database.user | default "forge" | quote }}
  cluster:
    name: forge-db
{{- end }}
