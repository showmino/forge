{{- $mode := .Values.database.mode }}
{{- if not (has $mode (list "bundled" "external" "cloudnativepg")) }}
{{- fail (printf "database.mode %q must be bundled, external or cloudnativepg" $mode) }}
{{- end }}
{{- if eq $mode "bundled" }}
{{- $b := .Values.database.bundled }}
{{- if not $b.existingSecret }}
{{- $password := randAlphaNum 32 }}
{{- with lookup "v1" "Secret" .Release.Namespace "forge-db" }}
{{- $password = index .data "password" | b64dec }}
{{- end }}
# The database: forge-api's catalog in "forge" and the login's sessions in
# "dex". The password is made once; an upgrade reads it back, and an
# uninstall keeps the Secret, like the volume.
apiVersion: v1
kind: Secret
metadata:
  name: forge-db
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "forge.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  password: {{ $password | b64enc | quote }}
  uri: {{ printf "postgres://forge:%s@forge-db.%s.svc:5432/forge?sslmode=disable" $password .Release.Namespace | b64enc | quote }}
---
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: forge-db-init
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "forge.labels" . | nindent 4 }}
data:
  dex.sql: |
    CREATE DATABASE dex OWNER forge;
---
apiVersion: v1
kind: Service
metadata:
  name: forge-db
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "forge.labels" . | nindent 4 }}
spec:
  selector: {app: forge-db}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: forge-db
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "forge.labels" . | nindent 4 }}
spec:
  serviceName: forge-db
  replicas: 1
  selector:
    matchLabels: {app: forge-db}
  template:
    metadata:
      labels: {app: forge-db}
    spec:
      automountServiceAccountToken: false
      securityContext:
        # The image's postgres user; it runs as any user that owns the data.
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: {{ $b.image | quote }}
          env:
            - {name: POSTGRES_USER, value: forge}
            - {name: POSTGRES_DB, value: forge}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ include "forge.dbSecret" $ }}, key: password}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports:
            - {name: postgres, containerPort: 5432}
          readinessProbe:
            exec:
              command: [pg_isready, -U, forge, -d, forge, -h, 127.0.0.1]
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: init, mountPath: /docker-entrypoint-initdb.d}
            - {name: run, mountPath: /var/run/postgresql}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
      volumes:
        - name: init
          configMap: {name: forge-db-init}
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with $b.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $b.size | quote }}
{{- else if eq $mode "cloudnativepg" }}
{{- $c := .Values.database.cloudnativepg }}
# CloudNativePG creates the Secret forge-db-app (keys uri, password, ...) for
# the owner forge. Backups are cloudnativepg.plugins.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: forge-db
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "forge.labels" . | nindent 4 }}
spec:
  instances: {{ $c.instances }}
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie
  storage:
    size: {{ $c.size | quote }}
    {{- with $c.storageClass }}
    storageClass: {{ . | quote }}
    {{- end }}
  bootstrap:
    initdb:
      database: forge
      owner: forge
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {memory: 512Mi}
  {{- with $c.plugins }}
  plugins:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $c.serviceAccountAnnotations }}
  serviceAccountTemplate:
    metadata:
      annotations:
        {{- toYaml . | nindent 8 }}
  {{- end }}
  {{- with $c.podLabels }}
  inheritedMetadata:
    labels:
      {{- toYaml . | nindent 6 }}
  {{- end }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: forge-db-dex
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "forge.labels" . | nindent 4 }}
spec:
  name: dex
  owner: forge
  cluster:
    name: forge-db
{{- end }}
