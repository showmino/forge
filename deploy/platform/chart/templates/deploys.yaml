{{- if .Values.deploys.enabled }}
{{- $_ := include "forge.gateway" . }}
{{- if contains "{{" (toJson .Values.apps.ingress.annotations) }}
{{- fail "apps.ingress.annotations must not contain {{: Argo CD's ApplicationSet would read it as a template" }}
{{- end }}
{{- $chartRev := .Values.deploys.chartRevision | default .Chart.AppVersion }}
{{- $chart := .Values.deploys.chart }}
# Deploys: Forge's Argo CD objects and forge-api's read access to them.
# Applications are named <service>-<env> and deploy into the namespace of
# that name; forge-api refuses a namespace that exists and isn't Forge's.
# Existing namespaces named like *-staging or *-production that are not
# Forge's go in deploys.excludedNamespaces, as "!<name>" deny destinations.
#
# The double-brace expressions you'll see below (name, releaseName,
# valueFiles, namespace, the forge.dev/* labels) are Argo CD ApplicationSet's
# own Go templates, evaluated by the applicationset controller per generated
# Application, not by Helm -- this chart emits them as literal text on
# purpose.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: forge-services
  namespace: argocd
  labels:
    {{- include "forge.labels" . | nindent 4 }}
spec:
  description: {{ printf "Forge services, deployed by forge-api through %s" (include "forge.deployRepo" .) | quote }}
  sourceRepos:
    # An OCI Helm source's allow-list entry: the exact string Argo CD
    # normalizes and glob-matches against the Application source's repoURL
    # below (verify this against your own Argo CD version -- production's
    # was checked against v3.5.3; IsSourcePermitted matched it literally
    # there).
    - {{ $chart | quote }}
    - {{ printf "https://github.com/%s.git" (include "forge.deployRepo" .) | quote }}
  destinations:
    {{- range .Values.deploys.excludedNamespaces }}
    {{- if not (regexMatch `^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$` .) }}
    {{- fail (printf "deploys.excludedNamespaces: %q is not a namespace name" .) }}
    {{- end }}
    - {server: https://kubernetes.default.svc, namespace: {{ printf "!%s" . | quote }}}
    {{- end }}
    - {server: https://kubernetes.default.svc, namespace: "*-staging"}
    - {server: https://kubernetes.default.svc, namespace: "*-production"}
    {{- if .Values.deploys.charts.enabled }}
    # A service that runs a chart: Forge's chart makes the chart's own
    # project here (forge-chart-<service>-<env>; see charts.yaml).
    - {server: https://kubernetes.default.svc, namespace: argocd}
    {{- end }}
  clusterResourceWhitelist:
    - {group: "", kind: Namespace}
  namespaceResourceWhitelist:
    - {group: apps, kind: Deployment}
    - {group: "", kind: Service}
    - {group: gateway.networking.k8s.io, kind: HTTPRoute}
    - {group: networking.k8s.io, kind: Ingress}
    - {group: "", kind: ResourceQuota}
    - {group: "", kind: LimitRange}
    # run.secrets, run.jobs and run.autoscaling (forge.yaml). A secrets
    # backend other than the default (secrets.backend) adds its own operator's
    # kind here by hand -- this list is static, not conditional on the value.
    - {group: onepassword.com, kind: OnePasswordItem}
    - {group: batch, kind: CronJob}
    - {group: keda.sh, kind: ScaledObject}
    {{- if .Values.apps.publicDomains }}
    # The DNS record of a public address (apps.publicDomains).
    - {group: kro.run, kind: CloudflareRecordsApplication}
    {{- end }}
    {{- if .Values.deploys.charts.enabled }}
    - {group: argoproj.io, kind: AppProject}
    {{- end }}
    # Not deployed by the chart: Argo CD leaves out of an application's tree
    # every kind its project does not allow, so without these the UI shows a
    # Deployment (or CronJob, or ScaledObject) with nothing under it.
    - {group: apps, kind: ReplicaSet}
    - {group: "", kind: Pod}
    - {group: batch, kind: Job}
    - {group: autoscaling, kind: HorizontalPodAutoscaler}
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: forge-services
  namespace: argocd
  labels:
    {{- include "forge.labels" . | nindent 4 }}
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: {{ printf "https://github.com/%s.git" (include "forge.deployRepo" .) | quote }}
        revision: main
        directories:
          - path: services/*/staging
          - path: services/*/production
        requeueAfterSeconds: 30
  template:
    metadata:
      name: '{{`{{ index .path.segments 1 }}`}}-{{`{{ .path.basename }}`}}'
      labels:
        app.kubernetes.io/managed-by: forge
      # Deleting a services/<service>/<env> directory removes its workload too.
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: forge-services
      sources:
        - repoURL: {{ $chart | quote }}
          targetRevision: {{ $chartRev | quote }}
          # Required for an OCI Helm source: with none of path/chart/ref set,
          # Argo CD rejects the spec outright (InvalidSpecError) rather than
          # defaulting it, so every generated Application would go straight
          # to ComparisonError. "." is the chart itself, per Argo CD's own
          # OCI docs.
          path: .
          helm:
            releaseName: '{{`{{ index .path.segments 1 }}`}}'
            valueFiles:
              - '$values/{{`{{ .path.path }}`}}/values.yaml'
            parameters:
              - {name: secretBackend, value: {{ .Values.secrets.backend | default "onepassword" | quote }}}
            # How every service is reached: the platform's choice, not the service's.
            valuesObject:
              route:
                kind: {{ .Values.apps.routing | quote }}
                gateway: {name: forge-previews, namespace: {{ .Release.Namespace | quote }}}
                ingress:
                  className: {{ .Values.apps.ingress.className | quote }}
                  annotations: {{ .Values.apps.ingress.annotations | toJson }}
                  tls: {{ .Values.apps.ingress.tls }}
                  domain: {{ include "forge.appsDomain" . | quote }}
              {{- if .Values.deploys.charts.enabled }}
              # The project of a chart service's chart (charts.yaml).
              chartProject:
                namespace: argocd
                sourceRepos:
                  {{- range .Values.deploys.charts.allowedRepos }}
                  - {{ . | quote }}
                  - {{ printf "%s/*" . | quote }}
                  {{- end }}
                deployRepo: {{ printf "https://github.com/%s.git" (include "forge.deployRepo" .) | quote }}
              {{- end }}
        - repoURL: {{ printf "https://github.com/%s.git" (include "forge.deployRepo" .) | quote }}
          targetRevision: main
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{`{{ index .path.segments 1 }}`}}-{{`{{ .path.basename }}`}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - CreateNamespace=true
          # Keep the replica count KEDA set on an autoscaled Deployment.
          - RespectIgnoreDifferences=true
        managedNamespaceMetadata:
          labels:
            app.kubernetes.io/managed-by: forge
            forge.dev/service: '{{`{{ index .path.segments 1 }}`}}'
            forge.dev/deploy-env: '{{`{{ .path.basename }}`}}'
            {{- if .Values.deploys.charts.enabled }}
            # A chart's pods are not Forge's: Kubernetes refuses privileged
            # pods, host networking and host paths in every service's
            # namespace, and warns about anything short of restricted.
            pod-security.kubernetes.io/enforce: baseline
            pod-security.kubernetes.io/warn: restricted
            {{- end }}
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jqPathExpressions:
            - 'select(.metadata.annotations["forge.dev/autoscaled"] == "true") | .spec.replicas'
---
# forge-api reads Applications to report sync and health.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: forge-api-applications
  namespace: argocd
  labels:
    {{- include "forge.labels" . | nindent 4 }}
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: forge-api-applications
  namespace: argocd
  labels:
    {{- include "forge.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: forge-api-applications
subjects:
  - {kind: ServiceAccount, name: forge-api, namespace: {{ .Release.Namespace }}}
{{- end }}
