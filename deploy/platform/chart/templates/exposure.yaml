{{- if and .Values.ingress.enabled .Values.gateway.enabled }}
{{- fail "set either ingress.enabled or gateway.enabled, not both" }}
{{- end }}
{{- $routes := include "forge.routes" . | fromYaml }}
{{- if and .Values.gateway.enabled .Values.gateway.appsGateway (not (include "forge.gateway" .)) }}
{{- fail "gateway.appsGateway needs the chart's Gateway: previews, or deploys with apps.routing gateway" }}
{{- end }}
{{- if and .Values.gateway.enabled .Values.gateway.appsGateway }}
{{- range $host, $_ := $routes }}
{{- range $.Values.apps.publicDomains }}
{{- if eq $host .domain }}
{{- fail (printf "%s is both one of Forge's hosts and a public domain's root: the Gateway would have two listeners for it. Put Forge on a host under it, such as forge.%s" $host $host) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: forge
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "forge.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.ingress.tls.secretName }}
  tls:
    - secretName: {{ . | quote }}
      hosts:
        {{- range $host, $_ := $routes }}
        - {{ $host | quote }}
        {{- end }}
  {{- end }}
  rules:
    {{- range $host, $paths := $routes }}
    - host: {{ $host | quote }}
      http:
        paths:
          {{- range $paths }}
          - path: {{ .path }}
            pathType: Prefix
            backend:
              service:
                name: {{ .service }}
                port: {number: {{ .port }}}
          {{- end }}
    {{- end }}
{{- end }}
{{- if .Values.gateway.enabled }}
{{- range $host, $paths := $routes }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ if eq (len $routes) 1 }}forge{{ else }}{{ printf "forge-%s" ($host | sha256sum | trunc 8) }}{{ end }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "forge.labels" $ | nindent 4 }}
spec:
  {{- /* The refs carry the defaults the API server fills in (group, kind,
  weight), so the live route equals this one and Argo CD does not report it
  OutOfSync when it syncs with server-side apply. */}}
  parentRefs:
    {{- if $.Values.gateway.appsGateway }}
    - {group: gateway.networking.k8s.io, kind: Gateway, name: forge-previews, namespace: {{ $.Release.Namespace }}, sectionName: {{ include "forge.hostListener" $host }}}
    {{- else }}
    {{- range ($.Values.gateway.parentRefs | required "gateway.parentRefs is required with gateway.enabled (or gateway.appsGateway)") }}
    - {{ mergeOverwrite (dict "group" "gateway.networking.k8s.io" "kind" "Gateway") . | toJson }}
    {{- end }}
    {{- end }}
  hostnames: [{{ $host | quote }}]
  rules:
    {{- range $paths }}
    - matches:
        - path: {type: PathPrefix, value: {{ .path }}}
      backendRefs:
        - {group: "", kind: Service, name: {{ .service }}, port: {{ .port }}, weight: 1}
      {{- if eq .service "forge-api" }}
      # Operation logs stream; don't cut them at the default route timeout.
      timeouts:
        request: "0s"
      {{- end }}
    {{- end }}
{{- end }}
{{- end }}
