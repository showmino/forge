{{- if and .Values.ingress.enabled .Values.gateway.enabled }}
{{- fail "set either ingress.enabled or gateway.enabled, not both" }}
{{- end }}
{{- $routes := include "forge.routes" . | fromYaml }}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: forge
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "forge.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.ingress.tls.secretName }}
  tls:
    - secretName: {{ . | quote }}
      hosts:
        {{- range $host, $_ := $routes }}
        - {{ $host | quote }}
        {{- end }}
  {{- end }}
  rules:
    {{- range $host, $paths := $routes }}
    - host: {{ $host | quote }}
      http:
        paths:
          {{- range $paths }}
          - path: {{ .path }}
            pathType: Prefix
            backend:
              service:
                name: {{ .service }}
                port: {number: {{ .port }}}
          {{- end }}
    {{- end }}
{{- end }}
{{- if .Values.gateway.enabled }}
{{- range $host, $paths := $routes }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ if eq (len $routes) 1 }}forge{{ else }}{{ printf "forge-%s" ($host | sha256sum | trunc 8) }}{{ end }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "forge.labels" $ | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml ($.Values.gateway.parentRefs | required "gateway.parentRefs is required with gateway.enabled") | nindent 4 }}
  hostnames: [{{ $host | quote }}]
  rules:
    {{- range $paths }}
    - matches:
        - path: {type: PathPrefix, value: {{ .path }}}
      backendRefs:
        - {name: {{ .service }}, port: {{ .port }}}
      {{- if eq .service "forge-api" }}
      # Operation logs stream; don't cut them at the default route timeout.
      timeouts:
        request: "0s"
      {{- end }}
    {{- end }}
{{- end }}
{{- end }}
