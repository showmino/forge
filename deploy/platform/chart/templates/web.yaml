{{- if .Values.web.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: forge-web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "forge.labels" . | nindent 4 }}
spec:
  selector: {app: forge-web}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forge-web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "forge.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels: {app: forge-web}
  template:
    metadata:
      labels: {app: forge-web}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
      containers:
        - name: forge-web
          image: {{ printf "%s:%s" .Values.web.image.repository .Values.web.image.tag | quote }}
          imagePullPolicy: IfNotPresent
          env:
            # The browser calls this address too, so it is the public one.
            - {name: FORGE_API_URL, value: {{ include "forge.apiURL" . | quote }}}
          ports:
            - {name: http, containerPort: 3000}
          readinessProbe:
            httpGet: {path: /api/healthz, port: http}
          livenessProbe:
            httpGet: {path: /api/healthz, port: http}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
{{- end }}
