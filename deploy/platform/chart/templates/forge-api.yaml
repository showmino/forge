apiVersion: v1
kind: ServiceAccount
metadata:
  name: forge-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "forge.labels" . | nindent 4 }}
{{- with .Values.previews.pullSecret }}
imagePullSecrets:
  - name: {{ . }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: forge-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "forge.labels" . | nindent 4 }}
spec:
  selector: {app: forge-api}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forge-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "forge.labels" . | nindent 4 }}
spec:
  replicas: 1 # operations are in memory; keep one replica
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: forge-api}
  template:
    metadata:
      labels: {app: forge-api}
    spec:
      serviceAccountName: forge-api
      securityContext:
        runAsNonRoot: true
        # distroless "nonroot" by number: the kubelet cannot check a user name.
        runAsUser: 65532
        runAsGroup: 65532
        # Secret files are root-owned; the group lets the API read its 0440 key.
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      volumes:
        - name: github-app
          secret:
            secretName: {{ .Values.github.existingSecret | required "github.existingSecret is required" }}
            defaultMode: 0440
            items:
              - {key: app-private-key, path: app-private-key}
      containers:
        - name: forge-api
          image: {{ include "forge.apiImage" . | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - {name: FORGE_OIDC_ISSUER, value: {{ include "forge.issuer" . | quote }}}
            - {name: FORGE_OIDC_CLIENT_ID, value: forge-cli}
            {{- if .Values.web.enabled }}
            - {name: FORGE_OIDC_WEB_CLIENT_ID, value: forge-web}
            {{- if ne (include "forge.apiHost" .) (include "forge.host" .) }}
            - {name: FORGE_CORS_ORIGINS, value: {{ include "forge.webURL" . | quote }}}
            {{- end }}
            {{- end }}
            - {name: FORGE_ADMIN_GROUPS, value: {{ include "forge.adminTeams" . | quote }}}
            - name: FORGE_DATABASE_URL
              valueFrom:
                secretKeyRef: {name: {{ include "forge.dbSecret" . }}, key: uri}
            - {name: FORGE_LOG_FORMAT, value: json}
            - {name: FORGE_GITHUB_APP_ID, value: {{ .Values.github.appID | required "github.appID is required" | quote }}}
            - {name: FORGE_GITHUB_APP_KEY_FILE, value: /etc/forge/github-app/app-private-key}
            - {name: FORGE_GITHUB_ORG, value: {{ include "forge.org" . | quote }}}
            - {name: FORGE_TEMPLATES_REPO, value: {{ include "forge.templatesRepo" . | quote }}}
            {{- with .Values.cliRepo }}
            - {name: FORGE_CLI_REPO, value: {{ . | quote }}}
            {{- end }}
            {{- with .Values.imageRegistry }}
            - {name: FORGE_IMAGE_REGISTRY, value: {{ . | quote }}}
            {{- end }}
            {{- if .Values.previews.enabled }}
            - {name: FORGE_PREVIEWS, value: "1"}
            - {name: FORGE_PREVIEW_GATEWAY, value: {{ printf "%s/forge-previews" .Release.Namespace | quote }}}
            - {name: FORGE_PREVIEW_DOMAIN, value: {{ printf "preview.%s" (.Values.previews.gatewayDomain | required "previews.gatewayDomain is required with previews.enabled") | quote }}}
            {{- with .Values.previews.pullSecret | required "previews.pullSecret is required with previews.enabled" }}
            - {name: FORGE_PREVIEW_PULL_SECRET, value: {{ printf "%s/%s" $.Release.Namespace . | quote }}}
            {{- end }}
            {{- end }}
            {{- if .Values.deploys.enabled }}
            - {name: FORGE_DEPLOYS, value: "1"}
            - {name: FORGE_DEPLOY_REPO, value: {{ include "forge.deployRepo" . | quote }}}
            {{- end }}
            {{- if .Values.clusters.enabled }}
            - {name: FORGE_CLUSTERS, value: "1"}
            - {name: FORGE_CLUSTER_NAME, value: {{ .Values.clusters.name | default "default" | quote }}}
            {{- with .Values.clusters.prometheusURL }}
            - {name: FORGE_PROMETHEUS_URL, value: {{ . | quote }}}
            {{- end }}
            {{- with .Values.clusters.grafanaURL }}
            - {name: FORGE_GRAFANA_URL, value: {{ . | quote }}}
            {{- end }}
            {{- end }}
            {{- with .Values.argocdURL }}
            - {name: FORGE_ARGOCD_URL, value: {{ . | quote }}}
            {{- end }}
            - {name: FORGE_SECRET_BACKEND, value: {{ .Values.secrets.backend | default "onepassword" | quote }}}
            {{- if or .Values.secrets.vaults .Values.secrets.deniedItems }}
            - {name: FORGE_SECRET_VAULTS, value: {{ .Values.secrets.vaults | quote }}}
            - {name: FORGE_SECRET_DENIED_ITEMS, value: {{ .Values.secrets.deniedItems | quote }}}
            {{- end }}
          volumeMounts:
            - {name: github-app, mountPath: /etc/forge/github-app, readOnly: true}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
