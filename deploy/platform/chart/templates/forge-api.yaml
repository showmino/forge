apiVersion: apps/v1
kind: Deployment
metadata:
  name: forge-api
  namespace: forge
spec:
  replicas: 1 # operations are in memory; keep one replica
  selector:
    matchLabels: {app: forge-api}
  template:
    metadata:
      labels: {app: forge-api}
    spec:
      {{- if .Values.previews.enabled }}
      serviceAccountName: forge-api
      {{- end }}
      securityContext:
        runAsNonRoot: true
        # distroless "nonroot" by number: the kubelet cannot check a user name.
        runAsUser: 65532
        runAsGroup: 65532
        # Secret files are root-owned; the group lets the API read its 0440 key.
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      volumes:
        - name: github-app
          secret: {secretName: forge-github-app, defaultMode: 0440}
      containers:
        - name: forge-api
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - {name: FORGE_OIDC_ISSUER, value: "{{ include "forge.dexURL" . }}/dex"}
            - {name: FORGE_OIDC_CLIENT_ID, value: forge-cli}
            {{- if .Values.webOrigins }}
            - {name: FORGE_OIDC_WEB_CLIENT_ID, value: forge-web}
            - {name: FORGE_CORS_ORIGINS, value: {{ join "," .Values.webOrigins | quote }}}
            {{- end }}
            - {name: FORGE_WRITER_GROUPS, value: {{ include "forge.writerGroups" . | quote }}}
            - name: FORGE_DATABASE_URL
              valueFrom:
                secretKeyRef: {name: {{ .Values.database.secretName | default "forge-db-app" }}, key: uri}
            - {name: FORGE_LOG_FORMAT, value: json}
            - {name: FORGE_GITHUB_APP_ID, value: {{ .Values.githubAppID | required "githubAppID is required" | quote }}}
            - {name: FORGE_GITHUB_APP_KEY_FILE, value: /etc/forge/github-app/github_app_private_key}
            - {name: FORGE_GITHUB_ORG, value: {{ .Values.githubOrg | required "githubOrg is required" | quote }}}
            - {name: FORGE_TEMPLATES_REPO, value: {{ include "forge.templatesRepo" . | quote }}}
            - {name: FORGE_CLI_REPO, value: {{ include "forge.forgeRepo" . | quote }}}
            {{- if .Values.previews.enabled }}
            - {name: FORGE_PREVIEWS, value: "1"}
            - {name: FORGE_PREVIEW_DOMAIN, value: {{ printf "preview.%s" (include "forge.previewBase" .) | quote }}}
            - {name: FORGE_PREVIEW_PULL_SECRET, value: {{ printf "forge/%s" (.Values.previews.pullSecret | required "previews.pullSecret is required when previews.enabled") | quote }}}
            {{- end }}
            {{- if .Values.deploys.enabled }}
            - {name: FORGE_DEPLOYS, value: "1"}
            - {name: FORGE_DEPLOY_REPO, value: {{ include "forge.deployRepo" . | quote }}}
            {{- end }}
            {{- if .Values.argocdURL }}
            - {name: FORGE_ARGOCD_URL, value: {{ .Values.argocdURL | quote }}}
            {{- end }}
            {{- if or .Values.secretVaults .Values.secretDeniedItems }}
            - {name: FORGE_SECRET_VAULTS, value: {{ .Values.secretVaults | quote }}}
            - {name: FORGE_SECRET_DENIED_ITEMS, value: {{ .Values.secretDeniedItems | quote }}}
            {{- end }}
            - {name: FORGE_SECRET_BACKEND, value: {{ .Values.secretBackend | default "onepassword" | quote }}}
          volumeMounts:
            - {name: github-app, mountPath: /etc/forge/github-app, readOnly: true}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            # Template releases are cached in memory (up to 100 MiB each).
            limits: {memory: 256Mi}
