{{- if .Values.previews.enabled }}
{{- $domain := .Values.previews.gatewayDomain | required "previews.gatewayDomain is required with previews.enabled" }}
# Exactly the calls internal/server/env_cluster.go makes. Kubernetes RBAC
# cannot limit them to Forge's own namespaces; forge-api enforces that itself
# (owned() in env_cluster.go).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ printf "%s-forge-api-previews" .Release.Namespace }}
  labels:
    {{- include "forge.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, create, patch, delete]
  - apiGroups: [""]
    resources: [secrets, services, resourcequotas, limitranges]
    verbs: [create]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, create]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-forge-api-previews" .Release.Namespace }}
  labels:
    {{- include "forge.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ printf "%s-forge-api-previews" .Release.Namespace }}
subjects:
  - {kind: ServiceAccount, name: forge-api, namespace: {{ .Release.Namespace }}}
---
# forge-api reads the pull secret to copy it into previews and to check images.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: forge-api-pull-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "forge.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ .Values.previews.pullSecret | quote }}]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: forge-api-pull-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "forge.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: forge-api-pull-secret
subjects:
  - {kind: ServiceAccount, name: forge-api, namespace: {{ .Release.Namespace }}}
---
# The Gateway previews (and with deploys, staging and production) are
# reached through. Point *.preview.<gatewayDomain> at its address.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: forge-previews
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "forge.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.previews.gatewayClass | quote }}
  {{- with .Values.previews.gatewayAnnotations }}
  infrastructure:
    annotations:
      {{- toYaml . | nindent 6 }}
  {{- end }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: {{ printf "*.preview.%s" $domain | quote }}
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              app.kubernetes.io/managed-by: forge
    {{- if .Values.deploys.enabled }}
    {{- range $env := list "staging" "production" }}
    - name: {{ $env }}
      protocol: HTTP
      port: 80
      hostname: {{ printf "*.%s.%s" $env $domain | quote }}
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              app.kubernetes.io/managed-by: forge
              forge.dev/deploy-env: {{ $env }}
    {{- end }}
    {{- end }}
{{- end }}
{{- if .Values.clusters.enabled }}
---
# Cluster capacity (clusters.enabled): exactly the calls
# internal/server/clusters.go makes, read only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ printf "%s-forge-api-clusters" .Release.Namespace }}
  labels:
    {{- include "forge.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [nodes, pods]
    verbs: [list]
  {{- if .Values.clusters.prometheusURL }}
  # With Prometheus: to tie volumes to their Forge service.
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [list]
  {{- end }}
  - apiGroups: [metrics.k8s.io]
    resources: [nodes]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-forge-api-clusters" .Release.Namespace }}
  labels:
    {{- include "forge.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ printf "%s-forge-api-clusters" .Release.Namespace }}
subjects:
  - {kind: ServiceAccount, name: forge-api, namespace: {{ .Release.Namespace }}}
{{- end }}
