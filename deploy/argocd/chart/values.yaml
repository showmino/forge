name: ""
env: ""
image: ""
port: 8080
health: /healthz
replicas: 1
host: ""
# The Gateway listener of the route; empty means the environment's own.
listener: ""
# The DNS record of a public address; unset for an internal one.
#   dns: {name: payments, zone: example-com, tunnel: production}
dns: null
# forge.yaml's run options, as forge-api writes them for this environment.
#   resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
resources: null
# run.env: plain environment variables, NAME: value.
vars: {}
# 1Password items (or, with another secretBackend, that backend's own
# shape): [{name: stripe, item: vaults/Apps/items/stripe, env: {STRIPE_KEY: credential}}]
secrets: []
# Which operator turns a run.secrets entry into a Kubernetes Secret.
# "onepassword": the 1Password Connect operator (the default). Anything
# else: nothing renders here; something else must create a Secret named
# <name>-secret with the fields run.secrets[].env maps.
secretBackend: onepassword
# Cron jobs: [{name: cleanup, schedule: "0 3 * * *", command: [node, cleanup.js]}]
jobs: []
# Production only: {min: 2, max: 6}; KEDA then sets the replica count.
autoscaling: null
