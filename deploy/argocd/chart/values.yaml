name: ""
env: ""
image: ""
port: 8080
health: /healthz
replicas: 1
host: ""
# The Gateway listener of the route; empty means the environment's own.
listener: ""
# How the service is reached, set by the platform (the ApplicationSet), not
# per service. "gateway": an HTTPRoute on gateway.namespace/gateway.name.
# "ingress": an Ingress of ingress.className; tls asks for a certificate in
# the Secret <name>-tls (for example from cert-manager's annotation), and a
# domain refuses any host outside *.<env>.<domain>.
route:
  kind: gateway
  gateway: {name: forge-previews, namespace: forge}
  ingress: {className: "", annotations: {}, tls: false, domain: ""}
# The DNS record of a public address; unset for an internal one.
#   dns: {name: payments, zone: example-com, tunnel: production}
dns: null
# forge.yaml's run options, as forge-api writes them for this environment.
#   resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
resources: null
# run.env: plain environment variables, NAME: value.
vars: {}
# 1Password items (or, with another secretBackend, that backend's own
# shape): [{name: stripe, item: vaults/Apps/items/stripe, env: {STRIPE_KEY: credential}}]
secrets: []
# Which operator turns a run.secrets entry into a Kubernetes Secret.
# "onepassword": the 1Password Connect operator (the default). Anything
# else: nothing renders here; something else must create a Secret named
# <name>-secret with the fields run.secrets[].env maps.
secretBackend: onepassword
# Cron jobs: [{name: cleanup, schedule: "0 3 * * *", command: [node, cleanup.js]}]
jobs: []
# Folders the app writes besides /tmp (run.writable): each gets an empty
# folder, since the root filesystem is read-only. [/var/cache/nginx]
writable: []
# Production only: {min: 2, max: 6}; KEDA then sets the replica count.
autoscaling: null
# A service that runs a published chart (forge.yaml chart:): Forge renders
# only the address, the quota and the DNS record, and the route goes to
# chart.expose. The chart itself is another Argo CD application.
#   chart: {repo: oci://ghcr.io/stefanprodan/charts, name: podinfo, version: 6.7.1, expose: {service: podinfo, port: 9898}}
chart: null
# The Argo CD project of a chart service's chart, set by the platform (the
# ApplicationSet): where projects live, the chart repositories allowed (an
# OCI one twice: the repository, and <repository>/* for its charts), and the
# deploy repo its values come from.
chartProject: {namespace: argocd, sourceRepos: [], deployRepo: ""}
