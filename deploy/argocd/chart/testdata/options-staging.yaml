name: payments
env: staging
image: ghcr.io/showmino/payments:1a2b3c4
port: 9090
health: /ready
replicas: 1
host: payments.staging.10.150.1.222.nip.io
database:
  secret: main-app
resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: 500m, memory: 512Mi}
vars:
  LOG_LEVEL: info
  FEATURE_X: "true"
secrets:
  - name: stripe
    item: vaults/Apps/items/stripe
    env: {STRIPE_KEY: credential, STRIPE_HOOK: webhook-secret}
jobs:
  - name: cleanup
    schedule: "0 3 * * *"
    command: [node, scripts/cleanup.js]
forge:
  service: services/payments
  env: staging
  ref: main
  commit: 1a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d
  actor: ana@example.com
  operation: operations/op_000000000001
  kind: deploy
  time: "2026-10-09T12:00:00Z"
