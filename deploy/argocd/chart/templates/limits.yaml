apiVersion: v1
kind: ResourceQuota
metadata:
  name: forge
spec:
  hard:
    # Room for the app and, next to it, a database of up to three instances.
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    pods: "15"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: forge
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 50m, memory: 64Mi}
      default: {cpu: 500m, memory: 512Mi}
