{{- /* With a chart, the route goes to the chart's own Service. */ -}}
{{- /* A worker serves nothing: no Service. */ -}}
{{- if not (or .Values.chart .Values.worker) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
spec:
  selector: {app: {{ .Values.name }}}
  ports:
    - {name: http, port: 80, targetPort: {{ .Values.port }}}
{{- end }}
