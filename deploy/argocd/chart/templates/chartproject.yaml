{{- /* A service that runs a published chart gets an Argo CD project of its
own, which its chart's application (<name>-<env>-chart, from the
forge-charts ApplicationSet) runs in: namespaced resources only, in this
namespace only, and none of the kinds that would take an address, a DNS
record, a quota or a platform secret. A chart, or a value such as
namespaceOverride, can then reach no other service's namespace. */ -}}
{{- with .Values.chart }}
{{- if not (has $.Values.env (list "staging" "production")) }}
{{- fail (printf "env %q must be staging or production" $.Values.env) }}
{{- end }}
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: {{ printf "forge-chart-%s-%s" $.Values.name $.Values.env }}
  namespace: {{ $.Values.chartProject.namespace | default "argocd" }}
spec:
  description: {{ printf "The chart %s of the Forge service %s in %s" .name $.Values.name $.Values.env | quote }}
  sourceRepos:
    {{- range $.Values.chartProject.sourceRepos }}
    - {{ . | quote }}
    {{- else }}
    - "*"
    {{- end }}
    {{- with $.Values.chartProject.deployRepo }}
    - {{ . | quote }}
    {{- end }}
  destinations:
    - {server: https://kubernetes.default.svc, namespace: {{ printf "%s-%s" $.Values.name $.Values.env | quote }}}
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - {group: "*", kind: "*"}
  namespaceResourceBlacklist:
    - {group: gateway.networking.k8s.io, kind: "*"}
    - {group: networking.k8s.io, kind: Ingress}
    - {group: extensions, kind: Ingress}
    - {group: "", kind: ResourceQuota}
    - {group: "", kind: LimitRange}
    - {group: kro.run, kind: "*"}
    - {group: onepassword.com, kind: "*"}
    - {group: external-secrets.io, kind: "*"}
    - {group: argoproj.io, kind: "*"}
{{- end }}
