{{- if eq (.Values.route.kind | default "gateway") "gateway" }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.name }}
spec:
  parentRefs:
    # A public address attaches to the Gateway's public listener; an internal
    # one to the listener of its environment.
    - {name: {{ .Values.route.gateway.name }}, namespace: {{ .Values.route.gateway.namespace }}, sectionName: {{ .Values.listener | default (required "env" .Values.env) }}}
  hostnames: [{{ required "host" .Values.host | quote }}]
  rules:
    - backendRefs:
        - {name: {{ include "forge.backendName" . }}, port: {{ include "forge.backendPort" . }}}
{{- end }}
