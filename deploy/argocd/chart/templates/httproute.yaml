apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.name }}
spec:
  parentRefs:
    # A public address attaches to the Gateway's public listener; an internal
    # one to the listener of its environment.
    - {name: forge-previews, namespace: forge, sectionName: {{ .Values.listener | default (required "env" .Values.env) }}}
  hostnames: [{{ required "host" .Values.host | quote }}]
  rules:
    - backendRefs:
        - {name: {{ .Values.name }}, port: 80}
