apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.name }}
spec:
  parentRefs:
    - {name: forge-previews, namespace: forge, sectionName: {{ required "env" .Values.env }}}
  hostnames: [{{ required "host" .Values.host | quote }}]
  rules:
    - backendRefs:
        - {name: {{ .Values.name }}, port: 80}
