apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ required "name" .Values.name }}
  labels: {app: {{ .Values.name }}}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: {app: {{ .Values.name }}}
  template:
    metadata:
      labels: {app: {{ .Values.name }}}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: forge-pull
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      # The root filesystem is read-only; /tmp is the one writable path.
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
      containers:
        - name: {{ .Values.name }}
          image: {{ required "image" .Values.image }}
          ports:
            - {name: http, containerPort: {{ .Values.port }}}
          env:
            - {name: PORT, value: "{{ .Values.port }}"}
          readinessProbe:
            httpGet: {path: {{ .Values.health }}, port: {{ .Values.port }}}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: {{ .Values.health }}, port: {{ .Values.port }}}
            initialDelaySeconds: 10
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
