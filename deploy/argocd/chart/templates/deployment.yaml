{{- /* A service that runs a chart (chart.expose set) has no pods of Forge's:
the chart brings them, in an Argo CD application of its own. */ -}}
{{- if not .Values.chart }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ required "name" .Values.name }}
  labels: {app: {{ .Values.name }}}
  {{- if .Values.autoscaling }}
  # KEDA owns the replica count; Argo CD ignores it on Deployments marked so.
  annotations: {forge.dev/autoscaled: "true"}
  {{- end }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: {app: {{ .Values.name }}}
  template:
    metadata:
      labels: {app: {{ .Values.name }}}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: forge-pull
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      # The root filesystem is read-only; /tmp and run.writable are the
      # writable paths.
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
        {{- range $i, $p := .Values.writable }}
        - name: writable-{{ $i }}
          emptyDir: {sizeLimit: 256Mi}
        {{- end }}
      containers:
        - name: {{ .Values.name }}
          image: {{ required "image" .Values.image }}
          ports:
            - {name: http, containerPort: {{ .Values.port }}}
          env:
            {{- include "forge.env" . | nindent 12 }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            httpGet: {path: {{ .Values.health }}, port: {{ .Values.port }}}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: {{ .Values.health }}, port: {{ .Values.port }}}
            initialDelaySeconds: 10
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            {{- range $i, $p := .Values.writable }}
            - {name: writable-{{ $i }}, mountPath: {{ $p | quote }}}
            {{- end }}
{{- end }}
