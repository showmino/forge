{{- /* A database that parts of an application share (forge.yaml's
resources[].share and run.links: [<part>/<resource>]). A pod cannot read a
Secret of another namespace, so forge-api copies the database's URL: it
reads the owning part's Secret and writes the copy, the Secret
forge-linked-database, in the linking part's namespace. These Roles are the
access it has for that, each on one named Secret. */ -}}
{{- $api := .Values.forgeApi | default dict }}
{{- $db := .Values.database | default dict }}
{{- if and $api.serviceAccount $api.namespace }}
# The copy is Forge's own Secret, by a fixed name. forge-api may replace and
# delete it in every service's namespace, so that it can also remove a copy
# after the link is gone; it reads no Secret here.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: forge-linked-database
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [forge-linked-database]
    verbs: [update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: forge-linked-database
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: forge-linked-database
subjects:
  - kind: ServiceAccount
    name: {{ $api.serviceAccount | quote }}
    namespace: {{ $api.namespace | quote }}
{{- if and $db.shared (not .Values.chart) }}
---
# The service shares its database: forge-api may read this one Secret, to
# copy its URL to the parts that link to it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: forge-shared-database
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ required "database.secret" $db.secret | quote }}]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: forge-shared-database
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: forge-shared-database
subjects:
  - kind: ServiceAccount
    name: {{ $api.serviceAccount | quote }}
    namespace: {{ $api.namespace | quote }}
{{- end }}
{{- end }}
