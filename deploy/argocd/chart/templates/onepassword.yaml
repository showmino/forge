{{- /* A 1Password item per run.secrets entry: the operator keeps a Secret of
the same name with the item's fields. The -secret suffix keeps it apart
from every other Secret in the namespace (the pull secret, the database's).
forge-api allows only some vaults. Rendered only when secretBackend is
"onepassword" (the default); another backend creates the Secret itself. */ -}}
{{- if eq (.Values.secretBackend | default "onepassword") "onepassword" }}
{{- range .Values.secrets }}
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ printf "%s-secret" .name }}
spec:
  itemPath: {{ required "secrets[].item" .item | quote }}
{{- end }}
{{- end }}
