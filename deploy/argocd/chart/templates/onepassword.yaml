{{- /* A 1Password item per run.secrets entry: the operator keeps a Secret of
the same name with the item's fields. forge-api allows only some vaults. */ -}}
{{- range .Values.secrets }}
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ printf "%s-%s" $.Values.name .name }}
spec:
  itemPath: {{ required "secrets[].item" .item | quote }}
{{- end }}
