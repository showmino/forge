{{- /* A 1Password item per run.secrets entry: the operator keeps a Secret of
the same name with the item's fields. The -1password suffix keeps it apart
from every other Secret in the namespace (the pull secret, the database's).
forge-api allows only some vaults. */ -}}
{{- range .Values.secrets }}
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ printf "%s-1password" .name }}
spec:
  itemPath: {{ required "secrets[].item" .item | quote }}
{{- end }}
