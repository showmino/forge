name: ci

# The checks run once, on the pull request. They do not run again on `main`
# after the merge: `main` only changes through pull requests, and a branch is
# merged only when it contains the current `main` and its checks passed
# (AGENTS.md, "Merging"), so the merge commit is the tree that was tested.
# A pull request that only changes docs runs nothing (the owner's rule).
on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "*.md"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Docker Hub's official image through Google's mirror: Docker Hub
        # rate-limits anonymous pulls from shared runner IPs.
        image: mirror.gcr.io/library/postgres:18
        env:
          POSTGRES_PASSWORD: forge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      FORGE_TEST_DATABASE_URL: postgres://postgres:forge@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go mod tidy -diff
      - run: go build ./...
      - run: go test -race -count=1 ./...
      - name: Deploy chart golden
        run: make chart-test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          version: 1.47.2
      - run: buf lint
      - name: buf breaking
        # Compare with the base branch from this checkout's own history
        # (fetch-depth: 0): cloning the private repo over HTTPS fails.
        run: buf breaking --against ".git#ref=refs/remotes/origin/${{ github.base_ref }}"
      - name: generated code is up to date
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.5
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.18.1
          buf generate
          git diff --exit-code -- gen/ || (echo "::error::run 'make generate' and commit gen/" && exit 1)

  runner-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The build fetches the provider into the image's mirror and runs
      # `tofu validate` on the module from it: an invalid module fails here.
      - run: docker build -f deploy/runner/Dockerfile -t forge-runner:ci .

  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check
