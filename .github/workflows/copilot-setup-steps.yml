name: Copilot setup steps

# What GitHub's coding agent has before it starts work in this repo: the Go
# toolchain of go.mod, buf and the protoc plugins, the linter CI uses, and a
# PostgreSQL for the store tests (run them with FORGE_TEST_DATABASE_URL=
# postgres://postgres:forge@localhost:5432/postgres?sslmode=disable, as
# ci.yml does; without it they are skipped). The job must be called
# copilot-setup-steps.
# It also runs when this file changes, so a broken setup is seen in review.
on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-setup-steps.yml]
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18
        env:
          POSTGRES_PASSWORD: forge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: buf and the protoc plugins (make generate)
        run: make tools
      - name: The linter, at the version CI pins
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - name: Download modules and check the tree builds
        run: go build ./...
