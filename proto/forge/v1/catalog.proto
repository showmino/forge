syntax = "proto3";

package forge.v1;

import "forge/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

// ServiceCatalogService manages the catalog of services known to Forge.
// Resource names follow AIP style: "services/{service}".
service ServiceCatalogService {
  // ListServices returns services, optionally filtered by owning team.
  rpc ListServices(ListServicesRequest) returns (ListServicesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // GetService returns one service by name.
  rpc GetService(GetServiceRequest) returns (GetServiceResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // RegisterService adds a service to the catalog.
  rpc RegisterService(RegisterServiceRequest) returns (RegisterServiceResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // UpdateService changes the fields named in update_mask.
  rpc UpdateService(UpdateServiceRequest) returns (UpdateServiceResponse) {}

  // DeleteService removes a service: its preview environments, its staging
  // and production deployments with their namespaces, and last its catalog
  // entry. The GitHub repo is kept. When anything runs on the cluster the
  // work is an operation (kind "delete_service") and the entry stays until it
  // has succeeded, so a failed delete can be asked for again. A service that
  // runs nothing is removed at once.
  rpc DeleteService(DeleteServiceRequest) returns (DeleteServiceResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // CreateService scaffolds a service from a template: it renders the
  // template, creates the GitHub repo, pushes the first commit and registers
  // the service, streaming progress. Errors before any side effect end the
  // stream with an error code; a failure after the repo exists ends it with
  // a CreateFailure.
  rpc CreateService(CreateServiceRequest) returns (stream CreateServiceResponse) {}
}

// Lifecycle is where a service is in its life.
enum Lifecycle {
  LIFECYCLE_UNSPECIFIED = 0;
  LIFECYCLE_EXPERIMENTAL = 1;
  LIFECYCLE_PRODUCTION = 2;
  LIFECYCLE_DEPRECATED = 3;
}

// Service is one entry in the catalog.
message Service {
  // Resource name, "services/{service}". Output only on register: derived from service_id.
  string name = 1;
  // Human-friendly name.
  string display_name = 2;
  // Team that owns the service.
  string owner_team = 3;
  // Individual owners (emails or handles).
  repeated string owners = 4;
  Lifecycle lifecycle = 5;
  // Source repository URL.
  string repo_url = 6;
  // Resource names of services this one depends on.
  repeated string dependencies = 7;
  // Free-form labels used for filtering.
  map<string, string> labels = 8;
  // Output only.
  google.protobuf.Timestamp create_time = 9;
  // Output only.
  google.protobuf.Timestamp update_time = 10;
  // Opaque version for optimistic concurrency. Output only, echoed back on update and delete.
  string etag = 11;
  // Where the service is reached, when set in Forge (DeployService.SetAddress)
  // rather than by forge.yaml. Output only.
  ServiceAddress address = 12;
}

// ServiceAddress overrides forge.yaml's run.host and run.domain.
message ServiceAddress {
  // "" for the service's name, "@" for the domain itself.
  string host = 1;
  // A public domain of the platform, "" for the default, or "none".
  string domain = 2;
  // Addresses the service took over although they were in use.
  repeated string claimed = 3;
}

message ListServicesRequest {
  // Maximum number of services to return. The server caps it at 500; 0 means 50.
  int32 page_size = 1;
  string page_token = 2;
  // Only return services owned by this team.
  string owner_team = 3;
}

message ListServicesResponse {
  repeated Service services = 1;
  string next_page_token = 2;
}

message GetServiceRequest {
  // "services/{service}"
  string name = 1;
}

message GetServiceResponse {
  Service service = 1;
}

message RegisterServiceRequest {
  // The short id, which becomes "services/{service_id}". Lowercase DNS label, 1-63 characters.
  string service_id = 1;
  Service service = 2;
  // Client-generated idempotency key. A retry with the same key returns the first result.
  string request_id = 3;
  // Validate only; do not create.
  bool validate_only = 4;
}

message RegisterServiceResponse {
  Service service = 1;
}

message UpdateServiceRequest {
  // service.name selects the service to update.
  Service service = 1;
  google.protobuf.FieldMask update_mask = 2;
  string request_id = 3;
  bool validate_only = 4;
}

message UpdateServiceResponse {
  Service service = 1;
}

message DeleteServiceRequest {
  string name = 1;
  // If set, the delete fails with FAILED_PRECONDITION unless it matches the current etag.
  string etag = 2;
  bool validate_only = 3;
}

message DeleteServiceResponse {
  // The teardown, when the service runs anything on the cluster; unset when
  // the service was removed at once (and for validate_only).
  Operation operation = 1;
  // What the delete takes down besides the catalog entry, as resource names:
  // "environments/pr-142", "deployments/payments/production". With
  // validate_only it is what a delete would take down.
  repeated string removes = 2;
}

message CreateServiceRequest {
  // Becomes services/{service_id} and the repo {github org}/{service_id}.
  string service_id = 1;
  // "templates/{template}".
  string template = 2;
  // Release tag; empty means the newest.
  string template_version = 3;
  // Template parameters as strings; the server converts them by type.
  map<string, string> parameters = 4;
  string owner_team = 5;
  repeated string owners = 6;
  // Idempotency key: a retry with the same key replays the first outcome.
  string request_id = 7;
  // Render and check; create nothing.
  bool validate_only = 8;
  // forge.yaml's run options, written into the new repo's forge.yaml over
  // the template's. Only the options the template offers may be set.
  RunOptions run_options = 9;
}

// RunOptions are forge.yaml's run options (see the README, "Run options").
// Unset fields leave the template's value.
message RunOptions {
  // Production's pod count; staging runs one.
  int32 replicas = 1;
  RunResources resources = 2;
  map<string, string> env = 3;
  repeated RunSecret secrets = 4;
  repeated RunJob jobs = 5;
  // Production grows from replicas up to this on CPU; 0 is no autoscaling.
  int32 autoscaling_max = 6;
  // Reached only on the platform's network: forge.yaml gets run.domain: none.
  // Every service template allows it.
  bool network_only = 7;
  // Staging reached only on the platform's network, production public:
  // forge.yaml gets run.staging.public: false. Every service template allows it.
  bool staging_network_only = 8;
}

// RunResources are the app container's requests and limits, as Kubernetes
// quantities ("100m", "128Mi").
message RunResources {
  string requests_cpu = 1;
  string requests_memory = 2;
  string limits_cpu = 3;
  string limits_memory = 4;
}

// RunSecret is a 1Password item given to the app as environment variables.
message RunSecret {
  string name = 1;
  // "vaults/<vault>/items/<item>".
  string item = 2;
  // Environment variable to the item's field.
  map<string, string> env = 3;
}

// RunJob is a cron job running the service's image.
message RunJob {
  string name = 1;
  string schedule = 2;
  repeated string command = 3;
}

// CreateServiceResponse is one message of the CreateService stream.
message CreateServiceResponse {
  oneof event {
    CreateStep step = 1;
    // Success: the registered service (last message).
    Service service = 2;
    // A failure after side effects began (last message).
    CreateFailure failure = 3;
    // validate_only: what would be created (last message).
    CreatePlan plan = 4;
    // Success of a file template: the pull request that adds its files (last message).
    ProposedChange change = 5;
  }
}

// CreateStep reports progress of one step: fetch, render, create_repo, grant_team,
// push, register.
message CreateStep {
  // State is where the step is.
  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_STARTED = 1;
    STATE_DONE = 2;
  }
  string name = 1;
  State state = 2;
  // For example "go-grpc@v1.4.0", "23 files" or a commit SHA.
  string detail = 3;
}

// CreateFailure ends a create that failed after the repo was created.
message CreateFailure {
  string step = 1;
  string message = 2;
  // True when the repo was deleted again.
  bool rolled_back = 3;
}

// CreatePlan is what a validate_only create would do.
message CreatePlan {
  string template_version = 1;
  // The new repo, or for a file template the repo the files go to.
  string repo_url = 2;
  repeated string files = 3;
}

// ProposedChange is the pull request a file template opened in its target repo.
message ProposedChange {
  string repo_url = 1;
  string branch = 2;
  string pull_request_url = 3;
  repeated string files = 4;
}
