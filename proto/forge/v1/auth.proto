syntax = "proto3";

package forge.v1;

import "google/protobuf/timestamp.proto";

// AuthService tells clients how to log in and who they are.
service AuthService {
  // GetServerInfo needs no credentials. The CLI calls it before login to discover
  // the identity provider and to check version skew.
  rpc GetServerInfo(GetServerInfoRequest) returns (GetServerInfoResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // GetStatus returns the caller's identity and permissions.
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // CreateSession turns a fresh login into a Forge session: a token of
  // Forge's own that keeps working without the identity provider. The caller
  // must present the ID token of a login made in the last few minutes, never
  // a session. The client the ID token was issued to decides the kind: the
  // CLI's lasts until it has not been used for 90 days, the web dashboard's
  // for 7 days.
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);

  // ListSessions returns the caller's own sessions.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // DeleteSession ends one of the caller's own sessions at once.
  rpc DeleteSession(DeleteSessionRequest) returns (DeleteSessionResponse);

  // TestPermissions returns which of the actions the caller may do, on a
  // service or, without one, anywhere: for clients to hide or disable what
  // the caller may not do. The server checks every call all the same.
  rpc TestPermissions(TestPermissionsRequest) returns (TestPermissionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message TestPermissionsRequest {
  // "services/{service}", or empty for actions about no one service
  // (service.create, service.register).
  string service = 1;
  // Actions such as "deploy.promote", as the audit log names them. Empty
  // asks for every action.
  repeated string actions = 2;
  // For service.create: the team the new service would belong to.
  string owner_team = 3;
}

message TestPermissionsResponse {
  // The actions of the request the caller may do, in the request's order.
  repeated string allowed = 1;
  // The caller's role toward the service: "admin", "team" or "reader".
  string role = 2;
}

// Session is a login Forge keeps for one client. Its token is shown once,
// by CreateSession.
message Session {
  // Client is what holds the session.
  enum Client {
    CLIENT_UNSPECIFIED = 0;
    CLIENT_CLI = 1;
    CLIENT_WEB = 2;
  }

  // "sessions/{id}".
  string name = 1;
  Client client = 2;
  // Where it was made, as the client said: a host name, a browser.
  string label = 3;
  google.protobuf.Timestamp create_time = 4;
  google.protobuf.Timestamp last_use_time = 5;
  // When it ends if it is not used again (CLI) or at the latest (web).
  google.protobuf.Timestamp expire_time = 6;
  // True for the session this call was made with.
  bool current = 7;
}

message CreateSessionRequest {
  // Where the session is made, to tell sessions apart: at most 100
  // printable characters.
  string label = 1;
}

message CreateSessionResponse {
  Session session = 1;
  // The bearer token. It is not stored and cannot be read again.
  string token = 2;
}

message ListSessionsRequest {}

message ListSessionsResponse {
  // Newest first.
  repeated Session sessions = 1;
}

message DeleteSessionRequest {
  // "sessions/{id}", or "sessions/current" for the one this call uses.
  string name = 1;
}

message DeleteSessionResponse {}

message GetServerInfoRequest {}

message GetServerInfoResponse {
  // Semantic version of the server, for example "0.1.0".
  string server_version = 1;
  // Oldest CLI version the server accepts.
  string min_client_version = 2;
  OIDCConfig oidc = 3;
  // True when the server turns a login into a session (CreateSession). A
  // client then needs no refresh token from the identity provider.
  bool sessions = 4;
}

// OIDCConfig is what a public client needs to log in: the CLI runs the
// device flow as client_id, the web dashboard the authorization code flow
// with PKCE as web_client_id.
message OIDCConfig {
  string issuer = 1;
  string client_id = 2;
  repeated string scopes = 3;
  // Client ID of the web dashboard; empty when the server accepts no
  // dashboard logins.
  string web_client_id = 4;
  // Scopes the web dashboard asks for: scopes without "offline_access", so
  // a browser is never handed a refresh token. Empty with web_client_id.
  repeated string web_scopes = 5;
}

message GetStatusRequest {}

message GetStatusResponse {
  // Subject claim of the token.
  string subject = 1;
  string email = 2;
  repeated string groups = 3;
  // Permissions granted to the caller, for example "services.read".
  // Clients use them only to tailor help and prompts; the server enforces them.
  repeated string permissions = 4;
  // The session this call was made with; unset for a call with an ID token.
  Session session = 5;
  // True for a member of an admin group, who may do everything on every
  // service.
  bool admin = 6;
  // The slugs of the organization's teams the caller is in. A team's members
  // work on the services it owns.
  repeated string teams = 7;
}
